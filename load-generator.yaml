apiVersion: apps/v1
kind: Deployment
metadata:
  name: load-generator
  namespace: project
  labels:
    app: load-generator
spec:
  replicas: 3
  selector:
    matchLabels:
      app: load-generator
  template:
    metadata:
      labels:
        app: load-generator
    spec:
      containers:
      - name: load
        image: busybox:1.38.0
        command:
        - /bin/sh
        - -c
        - 'while true; do wget -q -O /dev/null http://membership:8000/ || true; done'
        resources:
          requests:
            memory: "16Mi"
            cpu: "50m"
          limits:
            memory: "32Mi"
            cpu: "300m"
