apiVersion: apps/v1
kind: Deployment
metadata:
  name: firstservice
  namespace: project
  labels:
    app: firstservice
spec:
  replicas: 2
  selector:
    matchLabels:
      app: firstservice
  template:
    metadata:
      labels:
        app: firstservice
    spec:
      containers:
      - name: firstservice
        image: project/firstservice:v1
        command: ["/bin/sh", "-c", "touch /tmp/ready && exec uvicorn app:app --host 0.0.0.0 --port 8000"]
        ports:
        - containerPort: 8000
        startupProbe:
          httpGet:
            path: /health
            port: 8000
          periodSeconds: 3
          failureThreshold: 20
        readinessProbe:
          exec:
            command: ["test", "-f", "/tmp/ready"]
          initialDelaySeconds: 2
          periodSeconds: 3
          failureThreshold: 2
        livenessProbe:
          httpGet:
            path: /health
            port: 8000
          periodSeconds: 10
          timeoutSeconds: 2
          failureThreshold: 6
        resources:
          requests:
            memory: "64Mi"
            cpu: "50m"
          limits:
            memory: "256Mi"
            cpu: "250m"
