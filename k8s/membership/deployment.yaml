apiVersion: apps/v1
kind: Deployment
metadata:
  name: membership
  namespace: project
  labels:
    app: membership
spec:
  replicas: 2
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 1
      maxUnavailable: 0
  selector:
    matchLabels:
      app: membership
  template:
    metadata:
      labels:
        app: membership
    spec:
      containers:
      - name: membership
        image: project/membership:v1
        imagePullPolicy: IfNotPresent
        command: ["/bin/sh", "-c", "touch /tmp/ready && exec uvicorn app:app --host 0.0.0.0 --port 8000"]
        ports:
        - name: http
          containerPort: 8000
        env:
        - name: RELEASE
          value: "2"
        startupProbe:
          httpGet:
            path: /health
            port: 8000
          periodSeconds: 3
          failureThreshold: 20
        readinessProbe:
          exec:
            command: ["test", "-f", "/tmp/ready"]
          initialDelaySeconds: 2
          periodSeconds: 3
          failureThreshold: 2
        livenessProbe:
          httpGet:
            path: /health
            port: 8000
          periodSeconds: 10
          timeoutSeconds: 2
          failureThreshold: 6
        resources:
          requests:
            memory: "64Mi"
            cpu: "50m"
          limits:
            memory: "256Mi"
            cpu: "250m"
