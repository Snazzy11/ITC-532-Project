apiVersion: apps/v1
kind: Deployment
metadata:
  name: api
  namespace: project
  labels:
    app: api
spec:
  replicas: 2
  selector:
    matchLabels:
      app: api
  template:
    metadata:
      labels:
        app: api
    spec:
      containers:
      - name: api
        image: project/api:v1
        command: ["/bin/sh", "-c", "touch /tmp/ready && exec uvicorn app:app --host 0.0.0.0 --port 8000"]
        ports:
        - containerPort: 8000
        env:
        - name: APP_VERSION
          valueFrom:
            configMapKeyRef:
              name: api-config
              key: APP_VERSION
        - name: ENVIRONMENT
          valueFrom:
            configMapKeyRef:
              name: api-config
              key: ENVIRONMENT
        - name: CACHE_TTL
          valueFrom:
            configMapKeyRef:
              name: api-config
              key: CACHE_TTL
        - name: VALKEY_URL
          valueFrom:
            configMapKeyRef:
              name: api-config
              key: VALKEY_URL
        - name: DATABASE_URL
          valueFrom:
            secretKeyRef:
              name: db-credentials
              key: DATABASE_URL
        startupProbe:
          httpGet:
            path: /health
            port: 8000
          periodSeconds: 3
          failureThreshold: 20
        readinessProbe:
          exec:
            command: ["test", "-f", "/tmp/ready"]
          initialDelaySeconds: 2
          periodSeconds: 3
          failureThreshold: 2
        livenessProbe:
          httpGet:
            path: /
            port: 8000
          periodSeconds: 10
          timeoutSeconds: 2
          failureThreshold: 6
        resources:
          requests:
            memory: "64Mi"
            cpu: "50m"
          limits:
            memory: "256Mi"
            cpu: "500m"
