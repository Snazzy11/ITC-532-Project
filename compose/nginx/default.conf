log_format upstream_log '$remote_addr "$request" -> $upstream_addr '
                        'status=$status upstream_status=$upstream_status '
                        'time=$request_time';

# Docker's embedded DNS server. Naming it explicitly, and using a variable in
# proxy_pass below, forces nginx to re-resolve "api" while it runs. Without
# this, nginx resolves the name once at startup and never sees replicas
# added later.
resolver 127.0.0.11 valid=10s ipv6=off;

server {
    listen 80;
    server_name _;

    access_log /var/log/nginx/access.log upstream_log;

    location = /healthz {
        access_log off;
        default_type text/plain;
        return 200 "ok\n";
    }

    location / {
        set $api_upstream "api:8000";
        proxy_pass http://$api_upstream;
    }

    location /compute/ {
        set $compute_upstream "membership:8000";
        proxy_pass http://$compute_upstream;
    }

    location /orders {
        set $orders_upstream "membership:8000";
        proxy_pass http://$orders_upstream;
    }

}
